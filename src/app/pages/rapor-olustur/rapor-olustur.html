<div class="page">
  <p-toast></p-toast>

  <header class="topbar">
    <h1>RAPOR KAYIT SİSTEMİ</h1>
    <button type="button" class="user-menu">
      <i class="pi pi-user"></i>
      <span>Kullanıcı</span>
      <i class="pi pi-chevron-down"></i>
    </button>
  </header>

  <main class="content">

    <form class="form-card" [formGroup]="raporForm">

      <!-- Mükellef bilgileri -->
      <h3>Mükellef Bilgileri</h3>

      <div class="form-grid taxpayer-grid">
        <div class="form-field">
          <label for="vergiKimlikNo">Vergi Kimlik No</label>
          <input
            id="vergiKimlikNo"
            type="text"
            maxlength="10"
            inputmode="numeric"
            formControlName="vergiKimlikNo"
            (blur)="mukellefSorgula()">
        </div>

        <div class="form-field">
          <label for="tcKimlikNo">T.C. Kimlik No</label>
          <input
            id="tcKimlikNo"
            type="text"
            maxlength="11"
            inputmode="numeric"
            formControlName="tcKimlikNo"
            (blur)="mukellefSorgula()">
        </div>

        <div class="form-field">
          <label for="adSoyadUnvan">Ad Soyad / Unvan</label>
          <input
            id="adSoyadUnvan"
            type="text"
            formControlName="adSoyadUnvan">
        </div>
      </div>

      <!-- Rapor bilgileri -->
      <h3 class="section-title">Rapor Bilgileri</h3>

      <div class="form-grid report-grid">
        <div class="form-field">
          <label for="anaRaporTuru">Ana Rapor Türü</label>
          <p-select
            id="anaRaporTuru"
            [formControl]="raporForm.controls.anaRaporTuruId"
            [options]="anaRaporTurleri"
            optionLabel="anaRaporTuruAdi"
            optionValue="anaRaporTuruId"
            placeholder="Ana rapor türü seçiniz"
            (onChange)="anaRaporTuruDegisti()">
          </p-select>
        </div>

        <div class="form-field">
          <label for="raporTuru">Rapor Türü</label>
          <p-select
            id="raporTuru"
            [formControl]="raporForm.controls.raporTuruId"
            [options]="raporTurleri"
            optionLabel="raporTuruAdi"
            optionValue="raporTuruId"
            placeholder="Önce ana rapor türünü seçiniz">
          </p-select>
        </div>

        <div class="form-field">
          <label for="vergiKodu">Vergi Kodu</label>
          <p-select
            id="vergiKodu"
            [formControl]="raporForm.controls.vergiKoduId"
            [options]="vergiKodlari"
            optionLabel="vergiKoduAdi"
            optionValue="vergiKoduId"
            placeholder="Vergi kodu seçiniz">
          </p-select>
        </div>

        <div class="form-field">
          <label for="duzenlemeTarihi">Düzenleme Tarihi</label>
          <input
            id="duzenlemeTarihi"
            type="date"
            formControlName="duzenlemeTarihi">
        </div>
      </div>

      <div class="form-field report-number-field">
        <label for="raporKayitNo">Rapor Numarası</label>
        <input
          id="raporKayitNo"
          type="text"
          [value]="sonOlusturulanRaporNo ?? ''"
          placeholder="Sistem tarafından oluşturulacaktır"
          readonly>
      </div>

      <div class="form-field description-field">
        <label for="aciklama">Açıklama</label>
        <textarea
          id="aciklama"
          maxlength="255"
          rows="5"
          formControlName="aciklama"></textarea>
      </div>

      <div class="form-actions">
        <p-button
          label="İptal"
          type="button"
          [outlined]="true"
          (onClick)="iptalEt()">
        </p-button>
        <p-button
          label="Kaydet"
          type="button"
          (onClick)="kaydet()">
        </p-button>
      </div>

    </form>

  </main>
</div>
