<p-toast></p-toast>

<div class="page">
  <header class="topbar">
    <h1>RAPOR KAYIT SİSTEMİ</h1>
    <button type="button" class="user-menu">
      <i class="pi pi-user"></i>
      <span>Kullanıcı</span>
      <i class="pi pi-chevron-down"></i>
    </button>
  </header>

  <main class="content">
    <div class="page-heading">
      <h2>Yeni Rapor Kaydı</h2>
      <p>Sisteme yeni bir rapor kaydı oluşturabilirsiniz.</p>
    </div>

    <div class="card-container">
      <form [formGroup]="form" (ngSubmit)="kaydet()">

        <!-- Mükellef Bilgileri -->
        <section class="form-section">
          <h3>Mükellef Bilgileri</h3>
          <div class="grid-4">
            <div class="form-field">
              <label for="vkn">Vergi Kimlik No</label>
              <input pInputText id="vkn" formControlName="vergiKimlikNo" placeholder="10 haneli VKN" (blur)="mukellefSorgula()" />
            </div>

            <div class="form-field">
              <label for="tckn">T.C. Kimlik No</label>
              <input pInputText id="tckn" formControlName="tcKimlikNo" placeholder="11 haneli TCKN" (blur)="mukellefSorgula()" />
            </div>

            <div class="form-field">
              <label for="unvan">Ad Soyad / Ünvan</label>
              <input pInputText id="unvan" formControlName="adSoyadUnvan" placeholder="Mükellef sorgulanınca dolar" />
            </div>

            <div class="form-field">
              <label for="vergiKodu">Vergi Kodu</label>
              <p-select
                id="vergiKodu"
                [options]="vergiKodlari"
                formControlName="vergiKoduId"
                optionLabel="vergiKoduAdi"
                optionValue="vergiKoduId"
                placeholder="Seçiniz"
              ></p-select>
            </div>
          </div>
        </section>

        <!-- Rapor Bilgileri -->
        <section class="form-section">
          <h3>Rapor Bilgileri</h3>
          <div class="grid-3">
            <div class="form-field">
              <label for="anaRaporTuru">Ana Rapor Türü</label>
              <p-select
                id="anaRaporTuru"
                [options]="anaRaporTurleri"
                formControlName="anaRaporTuruId"
                optionLabel="anaRaporTuruAdi"
                optionValue="anaRaporTuruId"
                placeholder="Seçiniz"
                (onChange)="anaRaporTuruDegisti()"
              ></p-select>
            </div>

            <div class="form-field">
              <label for="raporTuru">Rapor Türü</label>
              <p-select
                id="raporTuru"
                [options]="raporTurleri"
                formControlName="raporTuruId"
                optionLabel="raporTuruAdi"
                optionValue="raporTuruId"
                placeholder="Önce ana rapor türü seçiniz"
              ></p-select>
            </div>

            <div class="form-field">
              <label for="duzenlemeTarihi">Düzenleme Tarihi</label>
              <p-datepicker
                id="duzenlemeTarihi"
                formControlName="duzenlemeTarihi"
                [showIcon]="true"
                dateFormat="dd.mm.yy"
              ></p-datepicker>
            </div>
          </div>

          <div class="form-field full-width" style="margin-top: 16px;">
            <label for="aciklama">Açıklama</label>
            <textarea pTextarea id="aciklama" formControlName="aciklama" rows="4" placeholder="Açıklama giriniz..."></textarea>
          </div>
        </section>

        <div class="form-actions">
          <button pButton type="button" [outlined]="true" (click)="iptal()" class="btn-cancel">
            <span>İptal ⨂</span>
          </button>
          <button pButton type="submit" [loading]="kaydediliyor" class="btn-save">
            <span>Kaydet 💾</span>
          </button>
        </div>
      </form>
    </div>
  </main>
</div>
