<p-toast></p-toast>

<div class="page">
  <header class="topbar">
    <h1>RAPOR KAYIT SİSTEMİ</h1>
    <button type="button" class="user-menu">
      <i class="pi pi-user"></i>
      <span>Kullanıcı</span>
      <i class="pi pi-chevron-down"></i>
    </button>
  </header>

  <main class="content">
    <div class="page-heading">
      <h2>Rapor Güncelle</h2>
      <p>Rapor kaydına ait bilgileri güncelleyebilirsiniz.</p>
    </div>

    <div class="card-container">
      <div class="card-header-badge">
        <span class="report-no">Rapor Kayıt No: {{ raporDetay?.raporKayitNo }}</span>
        <p-tag [value]="raporDetay?.durum || 'KAYITLI'" severity="success"></p-tag>
      </div>

      <form [formGroup]="form" (ngSubmit)="guncelle()">
        <section class="form-section">
          <h3>Mükellef Bilgileri</h3>
          <div class="grid-4">
            <div class="form-field">
              <label>Vergi Kimlik No</label>
              <input pInputText formControlName="vergiKimlikNo" />
            </div>
            <div class="form-field">
              <label>T.C. Kimlik No</label>
              <input pInputText formControlName="tcKimlikNo" />
            </div>
            <div class="form-field">
              <label>Ad Soyad / Ünvan</label>
              <input pInputText formControlName="adSoyadUnvan" />
            </div>
            <div class="form-field">
              <label>Vergi Kodu</label>
              <p-select
                [options]="vergiKodlari"
                formControlName="vergiKoduId"
                optionLabel="vergiKoduAdi"
                optionValue="vergiKoduId"
                placeholder="Seçiniz"
              ></p-select>
            </div>
          </div>
        </section>

        <section class="form-section">
          <h3>Rapor Bilgileri</h3>
          <div class="grid-3">
            <div class="form-field">
              <label>Ana Rapor Türü</label>
              <p-select
                [options]="anaRaporTurleri"
                formControlName="anaRaporTuruId"
                optionLabel="anaRaporTuruAdi"
                optionValue="anaRaporTuruId"
                (onChange)="anaRaporTuruDegisti()"
              ></p-select>
            </div>
            <div class="form-field">
              <label>Rapor Türü</label>
              <p-select
                [options]="raporTurleri"
                formControlName="raporTuruId"
                optionLabel="raporTuruAdi"
                optionValue="raporTuruId"
              ></p-select>
            </div>
            <div class="form-field">
              <label>Düzenleme Tarihi</label>
              <p-datepicker
                formControlName="duzenlemeTarihi"
                [showIcon]="true"
                dateFormat="dd.mm.yy"
              ></p-datepicker>
            </div>
          </div>

          <div class="form-field full-width">
            <label>Açıklama</label>
            <textarea pTextarea formControlName="aciklama" rows="4"></textarea>
          </div>
        </section>

        <div class="form-actions">
          <button pButton type="button" [outlined]="true" (click)="iptal()" class="btn-cancel">
            <span>İptal ⨂</span>
          </button>
          <button pButton type="submit" icon="pi pi-pencil" [loading]="kaydediliyor" class="btn-save">
            <span>Güncelle</span>
          </button>
        </div>
      </form>
    </div>
  </main>
</div>
