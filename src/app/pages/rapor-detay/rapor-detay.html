<div class="page">

  <header class="topbar">
    <h1>RAPOR KAYIT SİSTEMİ</h1>
    <button type="button" class="user-menu">
      <i class="pi pi-user"></i>
      <span>Kullanıcı</span>
      <i class="pi pi-chevron-down"></i>
    </button>
  </header>

  <main class="content">

    @if (rapor) {
      <div class="form-card">

        <div class="detail-header">
          <span>Rapor Kayıt No: {{ rapor.raporKayitNo }}</span>
          <p-tag [value]="rapor.durum" severity="success"></p-tag>
        </div>

        <h3>Mükellef Bilgileri</h3>
        <div class="form-grid taxpayer-grid">
          <div class="form-field">
            <label for="vergiKimlikNo">Vergi Kimlik No</label>
            <input pInputText id="vergiKimlikNo" type="text" readonly [value]="rapor.vergiKimlikNo ?? '-'">
          </div>
          <div class="form-field">
            <label for="tcKimlikNo">T.C. Kimlik No</label>
            <input pInputText id="tcKimlikNo" type="text" readonly [value]="rapor.tcKimlikNo ?? '-'">
          </div>
          <div class="form-field">
            <label for="adSoyadUnvan">Ad Soyad / Ünvan</label>
            <input pInputText id="adSoyadUnvan" type="text" readonly [value]="rapor.adSoyadUnvan">
          </div>
          <div class="form-field">
            <label for="vergiKodu">Vergi Kodu</label>
            <input pInputText id="vergiKodu" type="text" readonly
                   [value]="rapor.vergiKodu + ' - ' + rapor.vergiKoduAdi">
          </div>
        </div>

        <h3 class="section-title">Rapor Bilgileri</h3>
        <div class="form-grid report-grid">
          <div class="form-field">
            <label for="anaRaporTuru">Ana Rapor Türü</label>
            <input pInputText id="anaRaporTuru" type="text" readonly [value]="rapor.anaRaporTuruAdi">
          </div>
          <div class="form-field">
            <label for="raporTuru">Rapor Türü</label>
            <input pInputText id="raporTuru" type="text" readonly [value]="rapor.raporTuruAdi">
          </div>
          <div class="form-field">
            <label for="duzenlemeTarihi">Düzenleme Tarihi</label>
            <input pInputText id="duzenlemeTarihi" type="text" readonly
                   [value]="rapor.duzenlemeTarihi | date:'dd.MM.yyyy'">
          </div>
        </div>

        <div class="form-field description-field">
          <label for="aciklama">Açıklama</label>
          <textarea pInputText id="aciklama" readonly rows="4">{{ rapor.aciklama ?? '-' }}</textarea>
        </div>

        <div class="form-actions">
          <a pButton [outlined]="true" routerLink="/rapor-olustur">
            Sorgulama Ekranına Geri Dön
          </a>
        </div>

      </div>
    } @else if (hataMesaji) {
      <div class="form-card">
        <p>{{ hataMesaji }}</p>
      </div>
    } @else {
      <div class="form-card">
        <p>Yükleniyor...</p>
      </div>
    }

  </main>
</div>
